
<!DOCTYPE html>
<html>
<head>
    <title>Online Examination System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Online Examination System</h1>
    <style>

body {
    font-family: Arial;
    text-align: center;
    background: #f2f2f2;
}


#login, #exam, #result {
    margin: 20px auto;
    padding: 15px;
    width: 300px;
    background: white;
    border: 1px solid gray;
}

input, button {
    margin: 5px;
    padding: 8px;
}




    </style>

    <div id="login">
        <input type="text" id="name" placeholder="Enter student name">
        <button onclick="startExam()">Login</button>
    </div>

    <div id="exam" style="display:none">
        <h3 id="welcome"></h3>

        <p>HTML</p>
        <input type="radio" name="q1" value="1"> Hyper Text Markup Language<br>
        <input type="radio" name="q1" value="0"> Styling language<br>

        <p>CSS</p>
        <input type="radio" name="q2" value="1"> Styling<br>
        <input type="radio" name="q2" value="0"> Heading<br>

        <button onclick="calculateResult()">Submit</button>
    </div>

    <div id="result" style="display:none">
        <h5>Hello result is:</h5>
        <p id="score"></p>
    </div>

    <script src="script.js"></script>
</body>
</html>
